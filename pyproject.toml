[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-timecode"
version = "0.1.0"
description = "Timecode and frame numbers, both ways, strictly; on OpenTimelineIO"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["opentimelineio>=0.18.1,<0.19"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
terminal_timecode = ["examples.json"]

[tool.ruff]
line-length = 120
